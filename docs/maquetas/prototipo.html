<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PostIA · prototipo de firma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap">
<style>/* Tokens del sistema de diseño PostIA (claro / oscuro). Solo se definen aquí; el resto usa var(). */
:root, .tel {
  --background: #e4e5e8; --superficie: #f0f0f2; --superficie-elevada: #fbfbfd;
  --foreground: #1c1c20; --apagado: #5a5b63; --borde: #cfd0d5;
  --control: #767986; /* borde de controles: 3.4:1 sobre background */
  --primario: #c2007a; --primario-texto: #fbfbfd;
  --exito: #006d94; --atencion: #c2007a; --peligro: #c2007a; --logo-globo: #ff00aa;
  --font-sans: "Geist", system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, monospace;
  --radius-sm: 10px; --radius-md: 16px; --radius-lg: 22px; --radius-full: 9999px;
  /* Neumorfismo: luz arriba-izquierda y sombra abajo-derecha sobre el mismo color de fondo. */
  --neu-sombra: rgba(120, 124, 135, .45); --neu-luz: rgba(255, 255, 255, .92);
  --relieve: 6px 6px 14px var(--neu-sombra), -6px -6px 14px var(--neu-luz);
  --relieve-sm: 3px 3px 8px var(--neu-sombra), -3px -3px 8px var(--neu-luz);
  --hundido: inset 3px 3px 7px var(--neu-sombra), inset -3px -3px 7px var(--neu-luz);
}
.tel.oscuro {
  --background: #17171a; --superficie: #1f1f23; --superficie-elevada: #2a2a30;
  --foreground: #ededf0; --apagado: #a3a4ad; --borde: #2c2d33;
  --control: #6b6d78;
  --primario: #ff7ac8; --primario-texto: #1a0a14;
  --exito: #5cd0f2; --atencion: #ff7ac8; --peligro: #ff7ac8;
  --neu-sombra: rgba(0, 0, 0, .9); --neu-luz: rgba(255, 255, 255, .14);
}

* { box-sizing: border-box; }
body { margin: 0; padding: 32px; background: #c9cacf; font-family: var(--font-sans); color: #1c1c20; }
.pagina-t { font: 700 28px/34px var(--font-sans); letter-spacing: -.02em; margin: 0 0 4px; }
.pagina-s { margin: 0 0 24px; color: #46474f; font-size: 14px; }
.rejilla { display: flex; flex-wrap: wrap; gap: 40px 32px; align-items: flex-start; }

.tel { margin: 0; width: 390px; }
.tel figcaption { font: 600 13px/18px var(--font-sans); color: #46474f; margin: 0 0 10px 6px; }
.pantalla { position: relative; width: 390px; height: var(--h, 844px); overflow: hidden; border-radius: 40px; background: var(--background); color: var(--foreground); }
.contenido { position: absolute; inset: 0 0 100px 0; padding: 16px 24px 12px; overflow: hidden; display: flex; flex-direction: column; gap: 16px; }
.contenido > * { flex: none; }

/* tipografía */
.display { font: 700 30px/34px var(--font-sans); letter-spacing: -.03em; margin: 0; }
.titulo { font: 700 20px/24px var(--font-sans); letter-spacing: -.01em; margin: 0; }
.subtitulo { font: 600 16px/22px var(--font-sans); margin: 0; }
.cuerpo { font: 400 15px/22px var(--font-sans); margin: 0; }
.etiqueta { font: 500 13px/18px var(--font-sans); display: inline-flex; align-items: center; gap: 6px; margin: 0; }
.micro { font: 400 12px/16px var(--font-sans); margin: 0; }
.texto-sm { font: 400 13px/18px var(--font-sans); margin: 0; }
.dato { font: 400 13px/18px var(--font-mono); margin: 0; }
.apagado { color: var(--apagado); }
.centro { text-align: center; }
.i { width: 18px; height: 18px; flex: none; }
.enlace { color: var(--primario); font: 600 14px/20px var(--font-sans); text-decoration: underline; min-height: 44px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; }

/* estados interactivos */
a, button, input { -webkit-tap-highlight-color: transparent; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--primario); outline-offset: 3px; }
button { font: inherit; color: inherit; background: transparent; border: 0; padding: 0; cursor: pointer; }
.btn:active, .nav-i:active, .seg a:active, .fila:active, .icb:active, .gasto:active, .tags button:active { box-shadow: var(--hundido); }
.btn:disabled, .btn[aria-disabled="true"] { cursor: not-allowed; background: var(--borde); color: var(--foreground); box-shadow: var(--hundido); border: 1px dashed var(--control); }
.btn[aria-busy="true"] { cursor: progress; }

/* encabezado */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 52px; gap: 12px; }
.logo { height: 48px; width: 111px; color: var(--foreground); }
.atras { display: flex; align-items: center; gap: 10px; }
.icb { width: 44px; height: 44px; border-radius: var(--radius-full); display: grid; place-items: center; box-shadow: var(--relieve-sm); border: 1px solid var(--control); color: var(--foreground); }
.gasto { height: 44px; padding: 0 14px; border-radius: var(--radius-full); display: flex; align-items: center; gap: 8px; box-shadow: var(--relieve-sm); border: 1px solid var(--control); }
.tope { display: block; position: relative; width: 56px; height: 8px; border-radius: 4px; box-shadow: var(--hundido); border: 1px solid var(--control); overflow: visible; }
.tope b { display: block; height: 100%; width: var(--w); background: var(--foreground); border-radius: 3px; }
.tope::after { content: ""; position: absolute; top: -6px; bottom: -6px; left: 80%; width: 3px; background: var(--primario); box-shadow: 0 0 0 2px var(--background); border-radius: 1px; z-index: 2; }

/* secciones y filas */
section { display: flex; flex-direction: column; }
.sec-t { font: 600 13px/18px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; margin: 0 4px 12px; display: flex; justify-content: space-between; color: var(--apagado); }
.sec-t.sin { margin: 0; }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.fila { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--radius-lg); box-shadow: var(--relieve); color: inherit; text-decoration: none; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cuenta { font: 600 14px/18px var(--font-sans); }
.fila .cuerpo { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pie { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
.pie .i { color: var(--apagado); }
.fija { gap: 8px; }

/* estado: palabra + marca con forma propia */
.est { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/18px var(--font-sans); color: var(--foreground); }
.est .i { width: 16px; height: 16px; }
.est.pend { color: var(--primario); }
.est.pend .pt { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--primario); }
.est.ok { color: var(--exito); }
.est.mal { color: var(--foreground); font-weight: 700; padding: 8px 12px; border-radius: var(--radius-sm); box-shadow: var(--hundido); align-self: flex-start; }
.est.mal .i { color: var(--primario); }
.est.neutro { color: var(--apagado); }
.aviso, .nota { display: flex; align-items: flex-start; gap: 8px; margin: 0; font: 400 13px/18px var(--font-sans); }
.nota { color: var(--foreground); }
.aviso { color: var(--foreground); }
.ayuda { display: flex; align-items: flex-start; gap: 8px; margin: 0; font: 400 13px/18px var(--font-sans); color: var(--apagado); }
.ayuda .i { width: 16px; height: 16px; }

/* botones */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: var(--radius-md); font: 600 15px/20px var(--font-sans); width: 100%; }
.btn.prim { background: var(--primario); color: var(--primario-texto); box-shadow: var(--relieve); }
.btn.sec { color: var(--foreground); padding: 0 12px; font-size: 14px; box-shadow: var(--relieve-sm); border: 1px solid var(--control); }
.btn.chico { width: auto; align-self: flex-start; min-height: 44px; padding: 0 16px; }
.btn.grande { min-height: 56px; font-size: 16px; }
.dos { display: flex; gap: 14px; }
.dos .btn { flex: 1; }
.descartar { min-height: 44px; margin-top: 16px; text-align: center; color: var(--foreground); font: 500 14px/20px var(--font-sans); text-decoration: underline; }

/* inicio */
.ventana { display: flex; flex-direction: column; gap: 12px; }
.vacio { border-radius: var(--radius-lg); box-shadow: var(--hundido); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.reserva { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.reserva li { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--borde); padding-top: 8px; }

/* pieza */
.h-pieza { font-size: 28px; line-height: 32px; }
.laminas { display: flex; gap: 12px; margin: 0 -24px; padding: 8px 24px 14px; overflow: hidden; scroll-snap-type: x mandatory; scroll-padding-inline: 24px; }
.lamina { flex: none; width: 168px; aspect-ratio: 4/5; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; border-radius: var(--radius-sm); box-shadow: var(--relieve-sm); border: 1px solid var(--control); font: 700 16px/20px var(--font-sans); letter-spacing: -.01em; scroll-snap-align: start; }
.lamina.l1 { background: var(--foreground); color: var(--background); border-color: transparent; }
.texto { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: var(--radius-md); box-shadow: var(--hundido); }
.datos { margin: 0; padding: 4px 16px; border-radius: var(--radius-md); box-shadow: var(--hundido); display: flex; flex-direction: column; }
.datos > div { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; gap: 12px; }
.datos > div + div { border-top: 1px solid var(--borde); }
.datos dt { font: 500 13px/18px var(--font-sans); color: var(--apagado); display: inline-flex; gap: 6px; align-items: center; }
.datos dd { margin: 0; display: flex; align-items: center; gap: 12px; }
.aviso-ok { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--radius-lg); box-shadow: var(--relieve); }
.confirmar { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: var(--radius-lg); box-shadow: var(--relieve); border: 1px solid var(--control); }

/* calendario */
.seg { display: flex; padding: 4px; gap: 4px; border-radius: var(--radius-md); box-shadow: var(--hundido); border: 1px solid var(--control); }
.seg a { flex: 1; min-height: 44px; display: grid; place-items: center; border-radius: 12px; font: 600 14px/20px var(--font-sans); color: var(--apagado); text-decoration: none; padding: 0 12px; }
.seg a.on { background: var(--primario); color: var(--primario-texto); box-shadow: var(--relieve-sm); }
.seg.chico { padding: 3px; }
.seg.chico a { min-height: 44px; font-size: 13px; }
.semana-t { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dias { display: flex; flex-direction: column; gap: 14px; }
.dia { display: flex; gap: 12px; padding: 10px 14px; border-radius: var(--radius-lg); box-shadow: var(--relieve); }
.dia-n { width: 32px; display: flex; flex-direction: column; align-items: flex-start; }
.cal-l { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.cal-i { display: flex; flex-direction: column; gap: 3px; }
.cal-i + .cal-i { padding-top: 8px; border-top: 1px solid var(--borde); }
.cal-i .corto { font-size: 14px; line-height: 20px; }
.pilares { gap: 10px; }
.barra { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.barra i { grid-column: 1 / -1; height: 10px; border-radius: 5px; box-shadow: var(--hundido); border: 1px solid var(--control); position: relative; overflow: visible; }
.barra i::after, .progreso i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--foreground); border-radius: 5px; opacity: .78; }
.barra i::before { content: ""; position: absolute; top: -5px; bottom: -5px; left: var(--m); width: 3px; background: var(--primario); box-shadow: 0 0 0 2px var(--background); border-radius: 1px; z-index: 2; }

/* investigar */
.form { display: flex; flex-direction: column; gap: 8px; margin: 0; }
.campo { width: 100%; padding: 11px 16px; border-radius: var(--radius-md); box-shadow: var(--hundido); border: 1px solid var(--control); background: transparent; color: var(--foreground); font: 400 15px/22px var(--font-sans); min-height: 48px; }
.par2 { display: grid; grid-template-columns: 90px 1fr; gap: 12px; }
.par2 > div { display: flex; flex-direction: column; gap: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 10px; padding: 2px 2px 4px; }
.tags button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font: 500 13px/18px var(--font-sans); padding: 0 14px; border-radius: var(--radius-sm); box-shadow: var(--relieve-sm); border: 1px solid var(--control); }
.tags button.sel { box-shadow: var(--hundido); color: var(--foreground); font-weight: 700; }
.tags button.sel .i { color: var(--primario); }
.tags .i { width: 16px; height: 16px; }
.costo { color: var(--apagado); }
.progreso { height: 10px; border-radius: 5px; box-shadow: var(--hundido); border: 1px solid var(--control); position: relative; }
.progreso i { display: block; height: 100%; }

/* navegación */
.nav { position: absolute; left: 14px; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); height: 72px; display: flex; gap: 4px; padding: 6px; border-radius: 28px; box-shadow: var(--relieve); border: 1px solid var(--control); }
.nav-i { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 22px; font: 500 12px/14px var(--font-sans); color: var(--apagado); text-decoration: none; }
.nav-i.on { color: var(--primario); font-weight: 600; box-shadow: var(--hundido); }

.tel.oscuro .texto, .tel.oscuro .datos, .tel.oscuro .vacio, .tel.oscuro .est.mal { border: 1px solid var(--borde); }

/* pieza: CTA fija sobre la barra; el contenido se desplaza detrás */
.pantalla.con-cta .contenido { inset: 0 0 128px 0; }
.pantalla.sin-nav .contenido { inset: 0 0 24px 0; }
.pantalla.sin-nav .cta-fija { bottom: 0; padding-bottom: 20px; }
.pantalla.sin-nav.con-cta .contenido { inset: 0 0 128px 0; }
.rollo { display: flex; flex-direction: column; gap: 16px; }
.cta-fija { position: absolute; left: 0; right: 0; bottom: 100px; padding: 10px 24px 8px; background: var(--background); display: flex; flex-direction: column; gap: 6px; box-shadow: 0 -14px 14px var(--background); }
.cta-fija .btn { width: 100%; }
.centro { text-align: center; }

/* fallo de red al firmar */
.fallo { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: var(--radius-lg); box-shadow: var(--relieve); border: 1px solid var(--control); }
.fallo .est.mal { box-shadow: var(--hundido); }

/* ronda 3 */
.sig { font: 600 12px/16px var(--font-sans); color: var(--primario); border: 1px solid var(--primario); border-radius: var(--radius-full); padding: 1px 8px; margin-right: auto; margin-left: 8px; }
.meta .sig + .dato { margin-left: 8px; }
.puntos { display: flex; gap: 8px; justify-content: center; padding: 0 0 2px; }
.puntos i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--control); box-shadow: var(--hundido); }
.puntos i.v { background: var(--foreground); border-color: var(--foreground); box-shadow: none; }
.detalles { border-radius: var(--radius-md); box-shadow: var(--relieve-sm); border: 1px solid var(--control); padding: 0 16px; }
.detalles summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; font: 600 14px/20px var(--font-sans); cursor: pointer; list-style: none; }
.detalles summary::-webkit-details-marker { display: none; }
.detalles[open] summary .i { transform: rotate(180deg); }
.detalles .datos { box-shadow: none; padding: 0; }
.detalles .ayuda { padding: 4px 0 14px; }
.cal-a { display: flex; flex-direction: column; gap: 3px; color: inherit; text-decoration: none; min-height: 44px; }
.cal-a:active { box-shadow: var(--hundido); }
.fila-completa { grid-column: 1 / -1; }
.barra .aviso { margin-top: 2px; }
.tel.oscuro .fila, .tel.oscuro .dia, .tel.oscuro .aviso-ok, .tel.oscuro .fallo, .tel.oscuro .confirmar { border: 1px solid var(--borde); }
.btn.prim:disabled .i { width: 18px; height: 18px; }
.btn.prim:disabled { background: var(--borde); color: var(--foreground); }

/* ronda 4 */
.icono-aviso { display: inline-flex; flex: none; }
.aviso > span:last-child, .nota > span:last-child, .ayuda > span:last-child { flex: 1; min-width: 0; }
.ventana .aviso { margin: 0; }
.visor { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.visor .enlace { padding: 0 4px; }
.visor .i { margin-right: 6px; }
.enlace-sm { color: var(--primario); text-decoration: underline; font-weight: 600; }
.hoy { margin-top: 6px; font: 600 11px/14px var(--font-sans); color: var(--primario); border: 1px solid var(--primario); border-radius: var(--radius-full); padding: 1px 6px; }
.dia.es-hoy { box-shadow: var(--hundido); }
.pilares { padding-bottom: 14px; }
.pilares .seg.chico { margin: 4px 0 10px; }
.pilares .barra { margin-top: 10px; }
.pilares summary { color: var(--foreground); }
.btn[aria-busy="true"] .i { animation: giro 1s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn[aria-busy="true"] .i { animation: none; } }

/* teléfono real: una pantalla por fila, a ancho completo */
@media (max-width: 500px) {
  body { padding: 12px 0 32px; }
  .pagina-t, .pagina-s { padding: 0 16px; }
  .rejilla { gap: 28px; }
  .tel, .pantalla { width: 100%; }
  .tel figcaption { margin-left: 16px; }
}

/* Prototipo interactivo: reutiliza los componentes de pantallas.css (tokens, botones, filas, estados). */
:root { color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root {
    --background: #17171a; --foreground: #ededf0; --apagado: #a3a4ad; --borde: #2c2d33; --control: #6b6d78;
    --primario: #ff7ac8; --primario-texto: #1a0a14; --exito: #5cd0f2;
    --neu-sombra: rgba(0, 0, 0, .9); --neu-luz: rgba(255, 255, 255, .14);
  }
  .fila, .dia, .aviso-ok, .fallo, .confirmar { border: 1px solid var(--borde); }
}
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans); }
.app { max-width: 430px; margin: 0 auto; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 8px) 24px calc(var(--abajo, 24px) + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.app > * { flex: none; }
.con-nav { --abajo: 112px; }
.con-cta { --abajo: 150px; }
.barra-fija { position: fixed; left: 0; right: 0; bottom: 0; max-width: 430px; margin: 0 auto; padding: 10px 24px calc(14px + env(safe-area-inset-bottom)); background: var(--background); display: flex; flex-direction: column; gap: 6px; z-index: 5; border-top: 1px solid var(--borde); }
.nav.fija { position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); max-width: 402px; margin: 0 auto; z-index: 5; background: var(--background); }

/* carrusel real */
.carrusel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 24px; margin: 0 -24px; padding: 8px 24px 14px; -webkit-overflow-scrolling: touch; scrollbar-width: none; overscroll-behavior-x: contain; }
.carrusel::-webkit-scrollbar { display: none; }
.carrusel .lamina { width: min(228px, 62vw); scroll-snap-align: start; font-size: 17px; line-height: 22px; padding: 14px; }
.app .h-pieza { font-size: 25px; line-height: 29px; }
.carrusel .lamina:last-child { margin-right: 0; }
.lamina .n { font: 400 13px/18px var(--font-mono); }
.hoja { position: fixed; inset: 0; z-index: 20; background: var(--background); overflow-y: auto; padding: calc(env(safe-area-inset-top) + 16px) 24px calc(110px + env(safe-area-inset-bottom)); }
.hoja .rejilla-l { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
.hoja .lamina { width: auto; }
.hoja .barra-fija { z-index: 21; }
.toast { position: fixed; left: 24px; right: 24px; bottom: calc(168px + env(safe-area-inset-bottom)); max-width: 382px; margin: 0 auto; z-index: 30; padding: 12px 16px; border-radius: var(--radius-md); background: var(--foreground); color: var(--background); font: 500 14px/20px var(--font-sans); box-shadow: var(--relieve); }
.aviso-cae { display: flex; gap: 10px; padding: 14px 16px; border-radius: var(--radius-md); box-shadow: var(--hundido); border: 1px solid var(--control); font: 600 14px/20px var(--font-sans); }
.aviso-cae .i { color: var(--primario); margin-top: 1px; }
.btn[aria-busy="true"] { cursor: progress; }
.sin-estilo { all: unset; box-sizing: border-box; cursor: pointer; }

const firmadas = () => ORDEN.filter(id => piezas[id].estado === 'firmada');
const app = document.getElementById('app');
const sal = p => `${p.dia}, ${p.hora}`;

const est = {

/* ---------- vistas ---------- */
const vistasHtml = {
  inicio() {
    const pend = pendientes();
    const hechas = firmadas().length;
    if (!pend.length) {
      return `<div class="app con-nav">${cabeza()}<h1 class="display">Lunes 2 de noviembre</h1>
<div class="vacio"><p class="titulo">Nada por firmar</p><p class="cuerpo">Firmaste las 3 de esta ronda.<br><span class="apagado">Las ${hechas} salen en su día y hora.</span></p>
<ul class="reserva">${firmadas().map(id => `<li><span class="cuenta">${piezas[id].cuenta} · ${piezas[id].dia}</span>${est.ok('Firmada')}</li>`).join('')}</ul></div>
<p class="texto-sm apagado">El próximo turno abre mañana a las 8:00.</p></div>${nav()}`;
    }
    return `<div class="app con-nav">${cabeza()}<h1 class="display">Lunes 2 de noviembre</h1>

<p class="aviso"><span class="icono-aviso">${ic('alerta')}</span><span>Pasaste el 80 % del tope del mes.</span></p>
<button class="btn prim" type="button" data-act="secuencia">Firmar ${pend.length === 1 ? 'la última' : `las ${pend.length} en secuencia`}</button></div>
<section><h2 class="sec-t">Por firmar<span class="dato">${pend.length}</span></h2><ul class="lista">${pend.map((id, i) => fila(id, i === 0)).join('')}</ul></section></div>${nav()}`;
  },

  pieza() {
    const p = piezas[estado.id];
    const pos = ORDEN.indexOf(estado.id) + 1;
    const vis = (vistas[estado.id] ||= new Set());
    const aviso = caida[estado.id] ? `<div class="aviso-cae" role="status">${ic('alerta', true)}<span>Cambiaste el texto: tu firma anterior se cayó. Hay que firmar esta versión de nuevo.</span></div>` : '';
    return `<div class="app con-cta">${cabeza(true, `Pieza ${pos} de 3`)}
<div class="meta"><b class="cuenta">${p.pagina}</b>${est.pend()}</div>
<h1 class="display h-pieza">${p.titulo}</h1>
<p class="dato">Sale ${sal(p)} · margen de 30 min</p>${aviso}
<div class="carrusel" id="carrusel" role="group" aria-label="Carrusel de 6 láminas" tabindex="0">${LAMINAS.map((l, i) => `<div class="lamina${l.inicial ? ' l1' : ''}" data-i="${i}"><span class="n">${i + 1}/6</span><b>${l.t}</b></div>`).join('')}</div>
<div class="visor"><div class="puntos" id="puntos" role="img" aria-label="Viste ${vis.size} de 6 láminas">${LAMINAS.map((_, i) => `<i class="${vis.has(i) ? 'v' : ''}"></i>`).join('')}</div><button class="enlace sin-estilo" type="button" data-act="juntas">${ic('rejilla')}Ver las 6 juntas</button></div>
<article class="texto"><h2 class="etiqueta apagado">Texto del post</h2>${TEXTO.map(t => `<p class="cuerpo">${t}</p>`).join('')}<p class="texto-sm apagado">Fuente: <a href="#" class="enlace-sm" data-act="otro">investigación del 24 oct</a></p></article>
<p class="nota"><span class="icono-aviso">${ic('info')}</span><span>Texto escrito con IA: puede tener errores. Léelo entero antes de firmar.</span></p>
<details class="detalles"><summary>Detalles de la firma${ic('abajo')}</summary>
<dl class="datos"><div><dt>Fecha y hora</dt><dd><span class="dato">${sal(p)}</span> <a href="#" class="enlace" data-act="otro">Cambiar fecha</a></dd></div><div><dt>${ic('huella')}Huella</dt><dd class="dato">${p.huella}</dd></div></dl>
<p class="ayuda">${ic('info')}<span>La huella identifica esta versión exacta. Si cambias el texto o la pieza, tu firma se cae.</span></p></details>
<div class="dos"><button class="btn sec" type="button" data-act="otro">Pedir otra versión</button><button class="btn sec" type="button" data-act="otro">Corregir texto</button></div>
<button class="descartar" type="button" data-act="descartar">Descartar pieza</button></div>
<div class="barra-fija" id="cta"></div>${estado.hoja ? hoja() : ''}`;
  },

  descartar() {
    const p = piezas[estado.id];
    return `<div class="app">${cabeza(true, 'Pieza')}<div class="meta"><b class="cuenta">${p.pagina}</b>${est.pend()}</div><h1 class="display h-pieza">${p.titulo}</h1>
<div class="confirmar" role="alertdialog" aria-labelledby="cd-t"><p class="titulo" id="cd-t">¿Descartar esta pieza?</p><p class="cuerpo apagado">Se borran el texto y la pieza. No se puede deshacer. Esta pieza no ha generado gasto.</p>
<div class="dos"><button class="btn prim" type="button" data-act="volver">Conservar pieza</button><button class="btn sec" type="button" data-act="descartar-ok">Descartar</button></div>
<button class="btn sec" type="button" data-act="otro">Mejor dejarla en la reserva</button></div></div>`;
  },

  error() {
    const p = piezas[estado.id];
    return `<div class="app">${cabeza(true, 'Pieza')}<div class="meta"><b class="cuenta">${p.pagina}</b>${est.pend()}</div><h1 class="display h-pieza">${p.titulo}</h1>
<div class="fallo" role="alert"><p class="est mal">${ic('wifi')}No se pudo guardar tu firma</p><p class="cuerpo">Sin conexión. Todavía no se publicó nada y tu texto está intacto.</p>
<button class="btn prim" type="button" data-act="firmar">Reintentar ahora</button><button class="btn sec" type="button" data-act="volver">Volver a la pieza</button></div>
<p class="texto-sm apagado">Si no vuelve la conexión antes del ${sal(p)}, la pieza no sale y vuelve a pedirse tu firma.</p></div>`;
  },

  firmada() {
    const p = piezas[estado.id];
    const sig = pendientes()[0];
    const ps = sig && piezas[sig];
    return `<div class="app con-cta">${cabeza(true, `Pieza ${ORDEN.indexOf(estado.id) + 1} de 3`)}<div class="meta"><b class="cuenta">${p.pagina}</b>${est.ok()}</div>
<h1 class="display h-pieza">${p.titulo}</h1><p class="dato">Sale ${sal(p)} · margen de 30 min</p>
<div class="aviso-ok" role="status"><p class="cuerpo"><b>Firmada.</b> Se publica exactamente esta versión (huella <span class="dato">${p.huella}</span>).</p>
<button class="btn sec chico" type="button" data-act="deshacer">${ic('deshacer')}Deshacer firma</button>
<p class="texto-sm apagado">Puedes deshacerla hasta las ${p.hora}, antes de que salga.</p></div>
<button class="btn sec" type="button" data-act="cambiar-texto">Corregir el texto (la firma se cae)</button>
${ps ? `<p class="cuerpo"><b>Sigue:</b> ${ps.cuenta} · ${sal(ps)}<br><span class="apagado">${pendientes().length} por firmar en esta ronda.</span></p>` : `<div class="vacio"><p class="titulo">Terminaste esta ronda</p><p class="cuerpo apagado">3 de 3 firmadas. La primera sale ${sal(piezas.wav_mar)}.</p></div>`}</div>
<div class="barra-fija">${ps ? `<button class="btn prim grande" type="button" data-act="abrir" data-id="${sig}">Firmar ${ps.cuenta} · ${sal(ps)}</button><a href="#" class="enlace centro" data-act="inicio">Listo por ahora</a>` : `<button class="btn prim grande" type="button" data-act="inicio">Volver a Inicio</button>`}</div>`;
  },
};

function hoja() {
  return `<div class="hoja" role="dialog" aria-label="Las 6 láminas"><h2 class="titulo">Las 6 láminas</h2><div class="rejilla-l">${LAMINAS.map((l, i) => `<div class="lamina${l.inicial ? ' l1' : ''}"><span class="n">${i + 1}/6</span><b>${l.t}</b></div>`).join('')}</div>
<div class="barra-fija"><button class="btn prim grande" type="button" id="listo" data-act="cerrar-juntas" disabled>Baja hasta ver las 6</button></div></div>`;
}

/* ---------- CTA fija de la pieza ---------- */
function pintarCta() {
  const cta = document.getElementById('cta');
  if (!cta) return;
  const p = piezas[estado.id];
  const n = (vistas[estado.id] || new Set()).size;
  const nombre = `Firmar ${p.cuenta} · ${sal(p)}`;
  if (estado.firmando) {
    cta.innerHTML = `<button class="btn prim grande" type="button" aria-busy="true" disabled>${ic('cargando')}Firmando…</button><p class="texto-sm centro apagado">No cierres esta pantalla.</p>`;
  } else if (n < 6) {
    cta.innerHTML = `<button class="btn prim grande" type="button" disabled>${ic('candado')}${nombre}</button><p class="texto-sm centro">Viste ${n} de 6 láminas. Faltan ${6 - n} por ver.</p>`;
  } else {
    cta.innerHTML = `<button class="btn prim grande" type="button" data-act="firmar">${nombre}</button><p class="texto-sm centro apagado">Firmar no genera gasto: texto y plantilla no cuestan.</p>`;
  }
}
function pintarVistas() {
  const vis = vistas[estado.id];
  const puntos = document.getElementById('puntos');
  if (!puntos) return;
  [...puntos.children].forEach((el, i) => el.classList.toggle('v', vis.has(i)));
  puntos.setAttribute('aria-label', `Viste ${vis.size} de 6 láminas`);
  pintarCta();
}
function observarCarrusel() {
  const c = document.getElementById('carrusel');
  if (!c) return;
  const vis = (vistas[estado.id] ||= new Set());
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting && e.intersectionRatio >= 0.9) vis.add(Number(e.target.dataset.i)); });
    pintarVistas();
  }, { root: c, threshold: [0.9, 1] });
  c.querySelectorAll('.lamina').forEach(l => io.observe(l));
}

/* ---------- acciones ---------- */
function avisar(msg) {
  document.querySelector('.toast')?.remove();
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.append(t);
  toastTimer = setTimeout(() => t.remove(), 2400);
}
function ir(vista, id) {
  estado = { ...estado, vista, id: id ?? estado.id, firmando: false, hoja: false };
  render();
  window.scrollTo(0, 0);
}
function firmar() {
  const id = estado.id;
  if (estado.vista === 'error') { estado.vista = 'pieza'; render(); }
  estado.firmando = true;
  pintarCta();
  setTimeout(() => {
    estado.firmando = false;
    if (FALLAR_PRIMERA_VEZ && !estado.falloUsado) { estado.falloUsado = true; ir('error', id); return; }
    piezas[id].estado = 'firmada';
    delete caida[id];
    ir('firmada', id);
  }, 1100);
}
const acciones = {
  inicio: () => ir('inicio'),
  volver: () => (estado.vista === 'descartar' || estado.vista === 'error') ? ir('pieza') : ir('inicio'),
  abrir: el => ir('pieza', el.dataset.id),
  secuencia: () => ir('pieza', pendientes()[0]),
  descartar: () => ir('descartar'),
  'descartar-ok': () => { piezas[estado.id].estado = 'descartada'; ir('inicio'); avisar('Pieza descartada.'); },
  firmar,
  deshacer: () => { piezas[estado.id].estado = 'pend'; ir('pieza'); avisar('Firma deshecha. La pieza vuelve a «Por firmar».'); },
  'cambiar-texto': () => { const id = estado.id; piezas[id].estado = 'pend'; caida[id] = true; ir('pieza', id); },
  juntas: () => { estado.hoja = true; render(); },
  'cerrar-juntas': () => { const v = (vistas[estado.id] ||= new Set()); LAMINAS.forEach((_, i) => v.add(i)); estado.hoja = false; render(); },
  otro: () => avisar('Esta parte no está en el prototipo.'),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  acciones[el.dataset.act]?.(el);
});

function render() {
  app.innerHTML = vistasHtml[estado.vista]();
  if (estado.vista === 'pieza') { observarCarrusel(); pintarCta(); }
  if (estado.hoja) vigilarHoja();
}
function vigilarHoja() {
  const h = document.querySelector('.hoja');
  const listo = document.getElementById('listo');
  const revisar = () => {
    const fin = h.scrollTop + h.clientHeight >= h.scrollHeight - 8;
    listo.disabled = !fin;
    listo.textContent = fin ? 'Listo, las vi' : 'Baja hasta ver las 6';
  };
  h.addEventListener('scroll', revisar, { passive: true });
  revisar();
}
render();
</script></body></html>
